<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أم درمان نيوز | المنصة الإخبارية</title>
    
    <!-- خط Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #C8102E; /* اللون الأحمر من الشعار */
            --primary-dark: #A00D24;
            --bg: #F8F9FA;
            --text: #1E293B;
            --muted: #64748B;
            --white: #FFFFFF;
            --border: #E2E8F0;
            --radius: 12px;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }

        /* Header */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 0;
            border-bottom: 3px solid var(--primary);
        }

        .container {
            width: min(1200px, 95%);
            margin: 0 auto;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container img {
            height: 60px; /* حجم الشعار */
            object-fit: contain;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            transition: color 0.3s;
        }

        nav a:hover { color: var(--primary); }

        .breaking-news {
            background-color: var(--primary);
            color: var(--white);
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
        }

        .breaking-news span { animation: slide 15s linear infinite; display: inline-block; padding-right: 100%; }
        @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }

        /* Sections */
        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 40px 0 20px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 30px;
            background-color: var(--primary);
            border-radius: 4px;
        }

        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .news-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .news-card:hover { transform: translateY(-5px); }

        .news-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }

        .news-content { padding: 20px; display: flex; flex-direction: column; flex: 1; }

        .news-date { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }

        .news-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text);
        }

        .btn-read {
            margin-top: auto;
            background-color: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            transition: background 0.3s;
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-size: 1rem;
        }
        .btn-read:hover { background-color: var(--primary-dark); }

        /* Videos Grid */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* Modal (الخبر والتعليقات) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--white);
            max-width: 800px;
            margin: 40px auto;
            border-radius: var(--radius);
            position: relative;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
        }

        .modal-body { padding: 30px; }

        .modal-body img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-title { font-size: 2rem; margin-bottom: 15px; color: var(--primary-dark); }
        
        .article-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 30px;
            white-space: pre-line;
        }

        /* Comments Section */
        .comments-section {
            background: var(--bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .comments-section h3 { margin-bottom: 15px; color: var(--primary-dark); }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .comment-form input, .comment-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }

        .comment-form textarea { resize: vertical; min-height: 80px; }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            align-self: flex-start;
            font-family: inherit;
        }

        .comment-list { display: flex; flex-direction: column; gap: 15px; }

        .comment-item {
            background: var(--white);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border-right: 4px solid var(--primary);
        }

        .comment-name { font-weight: 700; color: var(--primary); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .comment-time { font-size: 0.8rem; color: var(--muted); font-weight: 400; }

        footer {
            background: #0F172A;
            color: white;
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 15px; }
            nav ul { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .videos-grid { grid-template-columns: 1fr; }
            .modal-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- الترويسة -->
    <header>
        <div class="container header-content">
            <div class="logo-container">
                <!-- تم تعديل اسم الصورة ليتطابق مع المرفوع على GitHub -->
                <img src="logo.png.jpeg" alt="أم درمان نيوز" onerror="this.src='https://via.placeholder.com/300x100/C8102E/FFFFFF?text=أم+درمان+نيوز'">
            </div>
            <nav>
                <ul>
                    <li><a href="#news">الأخبار</a></li>
                    <li><a href="#videos">فيديوهات</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- الشريط الإخباري المتحرك -->
    <div class="breaking-news">
        <div class="container">
            <span><i class="fas fa-bolt"></i> عاجل: منصة أم درمان نيوز تنطلق رسمياً لمتابعة كافة الأحداث والتطورات المحلية والعالمية...</span>
        </div>
    </div>

    <main class="container">
        
        <!-- قسم الأخبار -->
        <h2 class="section-title" id="news">أحدث الأخبار</h2>
        <div class="news-grid" id="newsGrid">
            <!-- سيتم ملء الأخبار هنا عبر الجافاسكربت -->
        </div>

        <!-- قسم الفيديوهات -->
        <h2 class="section-title" id="videos">فيديوهات مختارة</h2>
        <div class="videos-grid" id="videosGrid">
            <!-- سيتم ملء الفيديوهات هنا -->
        </div>

    </main>

    <!-- النافذة المنبثقة لقراءة الخبر والتعليقات -->
    <div class="modal" id="articleModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <div class="modal-body">
                <img id="modalImg" src="" alt="صورة الخبر">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="news-date" id="modalDate" style="margin-bottom: 20px;"></div>
                <div class="article-text" id="modalText"></div>
                
                <!-- قسم التعليقات -->
                <div class="comments-section">
                    <h3><i class="fas fa-comments"></i> التعليقات والمناقشات</h3>
                    
                    <form class="comment-form" id="commentForm" onsubmit="addComment(event)">
                        <input type="text" id="commentName" placeholder="اسمك" required>
                        <textarea id="commentText" placeholder="اكتب تعليقك هنا..." required></textarea>
                        <button type="submit" class="btn-submit">إرسال التعليق</button>
                    </form>

                    <div class="comment-list" id="commentList">
                        <!-- التعليقات تظهر هنا -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- التذييل مع روابط التواصل الاجتماعي -->
    <footer>
        <div class="container">
            
            <!-- أيقونات فيسبوك ويوتيوب -->
            <div class="social-links" style="margin-bottom: 20px; display: flex; justify-content: center; gap: 15px;">
                <!-- رابط صفحة الفيسبوك: استبدل الرابط أدناه برابط صفحتك -->
                <a href="https://www.facebook.com/YOUR_PAGE_NAME" target="_blank" title="فيسبوك" style="color: white; background: #1877F2; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                    <i class="fab fa-facebook-f"></i>
                </a>
                
                <!-- رابط قناة اليوتيوب: استبدل الرابط أدناه برابط قناتك -->
                <a href="https://www.youtube.com/@YOUR_CHANNEL_NAME" target="_blank" title="يوتيوب" style="color: white; background: #FF0000; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>

            <p>&copy; 2024 أم درمان نيوز. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script>
        // 1. بيانات الأخبار
        const newsData = [
            {
                id: 1,
                title: "تطورات جديدة في البنية التحتية لمدينة أم درمان",
                date: "15 مايو 2024",
                image: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&q=80&w=800",
                text: "شهدت مدينة أم درمان خلال الأيام الماضية حركة تطويرية واسعة في قطاع الطرق والجسور، حيث تم الإعلان عن افتتاح عدد من المشاريع الحيوية التي تهدف إلى تسهيل حركة المواطنين.\n\nوأكد المسؤولون أن هذه المشاريع ستساهم بشكل كبير في تحسين الواقع الخدمي وتقليل الاختناقات المرورية، مشيرين إلى أن العمل مستمر في باقي المراحل حسب الجدول الزمني المحدد."
            },
            {
                id: 2,
                title: "انطلاق فعاليات المهرجان الثقافي السنوي",
                date: "14 مايو 2024",
                image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=800",
                text: "انطلقت فعاليات المهرجان الثقافي السنوي وسط حضور جماهيري كبير، حيث تضمن اليوم الأول عروضاً فنية ومسرحية تعكس التراث الغني للمنطقة.\n\nويستمر المهرجان لمدة أسبوع كامل، ويتضمن ورش عمل وجلسات نقاشية بمشاركة نخبة من المثقفين والفنانين."
            },
            {
                id: 3,
                title: "أخبار الرياضة: نتائج مباريات الدوري المحلي",
                date: "13 مايو 2024",
                image: "https://images.unsplash.com/photo-1518605368461-1e1e38ce8102?auto=format&fit=crop&q=80&w=800",
                text: "شهدت الجولة الأخيرة من الدوري المحلي إثارة كبيرة، حيث حقق فريق أم درمان فوزاً ثميناً في الوقت القاتل.\n\nهذا الفوز يرفع رصيد الفريق في جدول الترتيب ويضعه في مركز متقدم للمنافسة على اللقب هذا الموسم."
            }
        ];

        // 2. بيانات فيديوهات اليوتيوب
        const videosData = [
            "dQw4w9WgXcQ",
            "9bZkp7q19f0",
            "jNQXAC9IVRw"
        ];

        // 3. دالة عرض الأخبار
        function renderNews() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = newsData.map(news => `
                <div class="news-card">
                    <img src="${news.image}" alt="${news.title}" class="news-img">
                    <div class="news-content">
                        <div class="news-date"><i class="far fa-clock"></i> ${news.date}</div>
                        <h3 class="news-title">${news.title}</h3>
                        <button class="btn-read" onclick="openArticle(${news.id})">اقرأ المزيد والمناقشة</button>
                    </div>
                </div>
            `).join('');
        }

        // 4. دالة عرض الفيديوهات
        function renderVideos() {
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = videosData.map(videoId => `
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                </div>
            `).join('');
        }

        // 5. دالة فتح الخبر
        let currentArticleId = null;

        function openArticle(id) {
            const article = newsData.find(n => n.id === id);
            if(!article) return;

            currentArticleId = id;
            document.getElementById('modalImg').src = article.image;
            document.getElementById('modalTitle').textContent = article.title;
            document.getElementById('modalDate').innerHTML = `<i class="far fa-clock"></i> ${article.date}`;
            document.getElementById('modalText').textContent = article.text;
            
            loadComments(id);
            document.getElementById('articleModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('articleModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            currentArticleId = null;
        }

        // 6. نظام التعليقات (LocalStorage)
        function addComment(e) {
            e.preventDefault();
            if(!currentArticleId) return;

            const name = document.getElementById('commentName').value;
            const text = document.getElementById('commentText').value;
            const date = new Date().toLocaleString('ar-EG');

            const newComment = { name, text, date };

            let allComments = JSON.parse(localStorage.getItem('omdurman_comments')) || {};
            if(!allComments[currentArticleId]) allComments[currentArticleId] = [];
            
            allComments[currentArticleId].unshift(newComment);
            localStorage.setItem('omdurman_comments', JSON.stringify(allComments));

            document.getElementById('commentForm').reset();
            loadComments(currentArticleId);
        }

        function loadComments(articleId) {
            const list = document.getElementById('commentList');
            let allComments = JSON.parse(localStorage.getItem('omdurman_comments')) || {};
            let comments = allComments[articleId] || [];

            if(comments.length === 0) {
                list.innerHTML = '<p style="color: gray; text-align: center;">لا توجد تعليقات بعد. كن أول من يشارك رأيه!</p>';
                return;
            }

            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-name">
                        <span><i class="fas fa-user-circle"></i> ${c.name}</span>
                        <span class="comment-time">${c.date}</span>
                    </div>
                    <p>${c.text}</p>
                </div>
            `).join('');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('articleModal');
            if (event.target == modal) closeModal();
        }

        renderNews();
        renderVideos();
    </script>
</body>
</html>
